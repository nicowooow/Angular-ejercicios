<main class="main">
  <div class="content">
    <div class="left-side">
      <h1>Hello, {{ title() }}</h1>
      <p>Congratulations! Your app is running. 🎉</p>
    </div>
    @if (role()) {
      <h3>eres admin</h3>
    } @else {
      <h3>no eres admin</h3>
    }
    <!--    aca se esta poniendo los binding de atributos , [class.(nombre de la clase a agregar)] = "condición" -->
    <h3
      [class.ok]="contador() <= 4"
      [class.ehh]="contador() > 4 && contador() <= 7"
      [class.error]="contador() > 7">Este es el contador : {{ contador() }}</h3>
    <p>Solo puedes aumentar hasta el número 10</p>
    <button
      type="button"
      (click)="aumentarContador()"
      [disabled]="contador()==10"
    >cliqueame
    </button>

    <app-gestion-coche></app-gestion-coche>
  </div>
</main>

<style>
  h1 {
    font-size: 3rem;
    text-shadow: 1px 1px 10px #016187;
  }

  .error {
    color: red;
  }

  .ehh {
    color: orange;
  }

  .ok {
    color: green;
  }
</style>
